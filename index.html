<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Investcalc</title>
    <script>
      // Apply the theme before first paint to avoid a flash (keep in sync with src/features/theme/theme.ts).
      (() => {
        var theme;
        try { theme = localStorage.getItem("investcalc:theme"); } catch {}
        if (theme !== "light" && theme !== "dark")
          theme = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        if (theme === "dark") document.documentElement.classList.add("dark");
        document.documentElement.style.colorScheme = theme;
      })();
      // Set the document language before first paint (keep in sync with src/features/i18n/language.ts).
      (() => {
        var language;
        var preferred = navigator.languages?.[0] || navigator.language || "";
        try { language = localStorage.getItem("investcalc:language"); } catch {}
        if (language !== "en" && language !== "de")
          language = preferred.toLowerCase().split("-")[0] === "de" ? "de" : "en";
        document.documentElement.lang = language;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
